<script src="assets/js/duck-ai-prompts.js"></script>
<script src="assets/js/duck-ai.js"></script>
<script>
(function () {
  var mount = document.getElementById('ai-chat-mount');
  if (!mount || !window.DuckAI) return;

  // Khung chat chiếm toàn bộ phần còn lại của màn hình: trừ đúng chiều cao thanh header (kể cả khi menu mobile mở)
  var header = document.querySelector('.site-header');
  var ro = null;
  function fit() { document.documentElement.style.setProperty('--duck-hdr', (header ? header.offsetHeight : 0) + 'px'); }
  fit();
  if (header && window.ResizeObserver) { ro = new ResizeObserver(fit); ro.observe(header); }
  window.addEventListener('resize', fit);

  var chat = DuckAI.mount(mount, 'learning', { full: true });
  var m = (location.hash || '').match(/^#bai-(.+)$/);
  if (m && chat.openLesson) chat.openLesson(m[1]);
  Duck.onLeave(function () {
    chat.destroy();
    if (ro) ro.disconnect();
    window.removeEventListener('resize', fit);
  });
})();
</script>
